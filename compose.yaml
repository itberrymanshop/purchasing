services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://purchasing:purchasing@postgres:5432/purchasing
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purchasing
      POSTGRES_USER: purchasing
      POSTGRES_PASSWORD: purchasing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchasing -d purchasing"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
